<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#11161d" />
<title>Oscar — Handy (mobiel)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #11161d; color: #1c2530; display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  /* status bar (decoratief) */
  .statusbar {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 18px; font-size: 13px; font-weight: 700; color: #11161d; background: #f4f6f9;
  }
  /* POS-scherm */
  .poswrap { flex: 1 1 auto; position: relative; overflow: hidden; background: #e9edf2; }
  .grid {
    height: 100%; overflow-y: auto; padding: 8px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-content: start;
  }
  .tile {
    background: #dfe5ec; border: 1px solid #cfd7e0; border-left: 4px solid #b9c2cd; border-radius: 8px;
    min-height: 70px; padding: 8px; font-size: 12px; font-weight: 600; color: #34404f;
    display: flex; align-items: center; line-height: 1.25;
  }
  .tile.g { border-left-color: #46b87a; }
  .tile.b { border-left-color: #4c8dff; }
  .tile.o { border-left-color: #f0a050; }
  /* CTA-overlay (valt over de grid) */
  .cta-stack {
    position: absolute; top: 8px; left: 8px; right: 8px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .cta {
    pointer-events: auto; background: #fff; border-radius: 16px; padding: 14px 16px;
    box-shadow: 0 12px 34px rgba(10,20,30,.45); animation: drop .2s ease-out;
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .cta .head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #5b6b7a; }
  .cta .head .ago { display: flex; align-items: center; gap: 6px; }
  .cta .head .dot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; display: inline-block; }
  .cta .head .vib { color: #8190a0; font-weight: 600; }
  .cta .title { font-size: 20px; font-weight: 800; color: #14202b; margin: 10px 0 14px; line-height: 1.25; }
  .cta .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cta.three .btns { grid-template-columns: 1fr 1fr 1fr; }
  .ob {
    min-height: 52px; border-radius: 12px; font: inherit; font-weight: 800; font-size: 16px;
    border: 1.5px solid #cdd7e2; background: #fff; color: #1f3a4a; cursor: pointer;
  }
  .ob:active { transform: scale(.97); }
  .ob.primary { background: #234b5c; border-color: #234b5c; color: #fff; }
  .cta.purple { background: linear-gradient(160deg,#3a2a63,#241b3f); }
  .cta.purple .title, .cta.purple .head { color: #ece5ff; }
  .cta.purple .head .vib { color: #b9a8e8; }
  .cta.purple .ob { background: rgba(255,255,255,.08); border-color: #6b54a0; color: #ece5ff; }
  .cta.purple .ob.primary { background: #9b59ff; border-color: #9b59ff; color: #fff; }
  /* toast */
  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
    background: rgba(18,26,36,.97); border: 1px solid #3a4a5c; color: #fff; padding: 16px 24px; border-radius: 16px;
    font-size: 18px; font-weight: 800; box-shadow: 0 16px 44px rgba(0,0,0,.6); opacity: 0;
    transition: opacity .18s, transform .18s; pointer-events: none; z-index: 100; max-width: 80%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* demo-lade */
  .tray-toggle {
    flex: 0 0 auto; border: none; border-top: 1px solid #2e3a48; background: #11161d; color: #8b9aac;
    padding: 14px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .tray { flex: 0 0 auto; background: #11161d; max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .tray.open { max-height: 62vh; overflow-y: auto; }
  .tray-inner { padding: 4px 14px calc(16px + env(safe-area-inset-bottom)); }
  .tray h4 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #8b9aac; }
  .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tgrid.three { grid-template-columns: 1fr 1fr 1fr; }
  .tbtn {
    min-height: 44px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    border: 1px solid #2e3a48; background: #2b3644; color: #e6edf3; border-radius: 10px; padding: 6px;
  }
  .tbtn:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="statusbar"><span>14:45</span><span>5G ▪▪▪ ▮</span></div>

<div class="poswrap">
  <div class="grid" id="grid"></div>
  <div class="cta-stack" id="ctaStack"></div>
</div>

<div class="toast" id="toast"></div>

<button class="tray-toggle" id="trayToggle" onclick="toggleTray()">▲ Demo-bediening</button>
<div class="tray" id="tray">
  <div class="tray-inner">
    <h4>Push een CTA (valt over de grid)</h4>
    <div class="tgrid">
      <button class="tbtn" onclick="force(1)">CTA 1 · first order</button>
      <button class="tbtn" onclick="force(2)">CTA 2 · sleeping</button>
      <button class="tbtn" onclick="force(3)">CTA 3 · seater</button>
      <button class="tbtn" onclick="force(4)">CTA 4 · promo</button>
      <button class="tbtn" onclick="force(5)">CTA 5 · offer coffee</button>
      <button class="tbtn" onclick="force(6)">CTA 6 · ready main</button>
      <button class="tbtn" onclick="force(7)">CTA 7 · active?</button>
      <button class="tbtn" onclick="force(8)">CTA 8 · ready dessert</button>
      <button class="tbtn" onclick="force(9)">CTA 9 · wil bestellen</button>
      <button class="tbtn" onclick="force(10)">CTA 10 · wil betalen</button>
    </div>
    <h4>Tafel 14 (Sanne)</h4>
    <div class="tgrid three">
      <button class="tbtn" onclick="aanbieden()">Aanbieden 🎁</button>
      <button class="tbtn" onclick="resetTable()">Reset</button>
      <button class="tbtn" onclick="clearAll()">Wis CTA's</button>
    </div>
  </div>
</div>

<script>
const T = {
  CTA1_POSTPONE: 300, CTA2_THRESHOLD: 1800, CTA5_POSTPONE: 600,
  CTA6_REPUSH: 300, CTA6_AUTOFIRE: 300, CTA6_MAX: 2, CTA8_REPUSH: 300, CTA8_MAX: 2,
};
let clock = 0, ctaSeq = 1, ctas = [], toastTimer = null;
const table = {};
function resetTable(){
  table.nr = 14; table.naam = "Sanne"; table.offered = false; table.mainFiredAt = null;
  table.cta5Done = false; table.cta5RepushAt = 0;
  table.cta6Done = false; table.cta6Pushes = 0; table.cta6RepushAt = 0; table.cta6AutoFireAt = 0;
  table.cta8Done = false; table.cta8Pushes = 0; table.cta8RepushAt = 0;
  ctas = []; render(); toast("Tafel gereset");
}

/* productgrid zoals de echte handy (drankjes) */
const PRODUCTS = [
  ["Macchiato"],["Flat White"],["Koffie verkeerd"],
  ["Espresso","g"],["Dubbele espresso"],["Espresso macchiato"],
  ["Cortado","b"],["Americano"],["Babyccino","b"],
  ["IJskoffie"],["Thee »","g"],["Gember thee","g"],
  ["Power Tea","g"],["Munt thee"],["Warme choco","g"],
  ["Warme choco slagroom"],["Matcha Latte","b"],["ICED Matcha","b"],
  ["Iced Matcha Mango"],["Choco Rum"],["Speciale koffie »"],
];
function renderGrid(){
  document.getElementById("grid").innerHTML = PRODUCTS.map(([n,c]) =>
    `<div class="tile ${c||""}">${n}</div>`).join("");
}

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

function hasCTA(type){ return ctas.some(c => c.type===type); }
function addCTA(type){
  if (hasCTA(type)) return;
  if (type===5 && table.offered){ toast("CTA 5 vervalt — al aangeboden"); return; }
  ctas.push({ id: ctaSeq++, type, createdAt: clock }); render();
}
function removeCTA(id){ ctas = ctas.filter(c => c.id!==id); render(); }
function force(type){
  if (type===6){ table.cta6Done=false; table.cta6Pushes=1; table.cta6RepushAt=0; table.cta6AutoFireAt=0; }
  if (type===8){ table.cta8Done=false; table.cta8Pushes=1; table.cta8RepushAt=0; }
  if (type===5){ table.cta5Done=false; }
  addCTA(type);
}
function aanbieden(){ table.offered = true; ctas = ctas.filter(c=>c.type!==5); render(); toast("Aangeboden product op rekening"); }
function clearAll(){ ctas = []; render(); }

function ctaToast(type, action){
  const waits = { "1/wait": T.CTA1_POSTPONE, "2/wait": T.CTA2_THRESHOLD, "5/wait": T.CTA5_POSTPONE };
  const key = type + "/" + action;
  if (waits[key] != null) return `${Math.round(waits[key]/60)} min extra wait`;
  if (key === "6/no") return `Wait ${Math.round(T.CTA6_REPUSH/60)} minutes`;
  if (key === "8/no") return `Wait ${Math.round(T.CTA8_REPUSH/60)} minutes`;
  const map = {
    "1/order":"WaiterPro opened","1/move":"Bill moved","1/close":"Table closed",
    "2/order":"WaiterPro opened","2/move":"Bill moved","2/calllg":"LG informed",
    "3/new":"Table opened","3/pull":"Bill moved","4/ok":"Promo active (background)",
    "5/order":"Gift registered","5/no":"No need","6/go":"Main ordered",
    "7/ja":"Active","7/nee":"Removed","7/pauze":"break","8/go":"Dessert Go",
    "9/order":"WaiterPro opened","9/dismiss":"Dismissed","10/print":"Ticket printed","10/dismiss":"Dismissed",
  };
  return map[key] || "OK";
}
function ctaAction(id, action){
  const c = ctas.find(x => x.id===id); if (!c) return;
  toast(ctaToast(c.type, action));
  switch (c.type + "/" + action){
    case "5/order":  table.offered = true; table.cta5Done = true; removeCTA(id); break;
    case "5/wait":   removeCTA(id); table.cta5RepushAt = clock + T.CTA5_POSTPONE; break;
    case "5/no":     table.cta5Done = true; removeCTA(id); break;
    case "6/go":     table.mainFiredAt = clock; table.cta6Done = true; removeCTA(id); break;
    case "6/no":     removeCTA(id); if (table.cta6Pushes < T.CTA6_MAX) table.cta6RepushAt = clock + T.CTA6_REPUSH; else { table.cta6Done = true; table.cta6AutoFireAt = clock + T.CTA6_AUTOFIRE; } break;
    case "8/go":     table.cta8Done = true; removeCTA(id); break;
    case "8/no":     removeCTA(id); if (table.cta8Pushes < T.CTA8_MAX) table.cta8RepushAt = clock + T.CTA8_REPUSH; else table.cta8Done = true; break;
    case "3/pull":   { prompt("Pull table → welke oude tafel?"); removeCTA(id); } break;
    default:         removeCTA(id); break;
  }
}

// prio-volgorde: 1, 2, 9, 10, 3, 4, 5, 6, 7, 8 (CTA 9/10 vlak na 1/2 — gast wacht)
const PRIO = { 1:1, 2:2, 9:3, 10:4, 3:5, 4:6, 5:7, 6:8, 7:9, 8:10 };
function tl(){ return table.naam ? `Tafel ${table.nr} (${table.naam})` : `Tafel ${table.nr}`; }
const CARD = {
  1: () => ({ cls:"",       title:`${tl()} — Drankje opnemen`,            btns:[["order","primary","order"],["wait","","wait"],["move","","move"],["close","","close"]] }),
  2: () => ({ cls:"",       title:`${tl()} — Checken`,                    btns:[["order","primary","order"],["wait","","wait"],["move","","move"],["call lg","","calllg"]] }),
  3: () => ({ cls:"",       title:`${tl()} — Not seated. Previous table?`, btns:[["new","primary","new"],["pull","","pull"]] }),
  4: () => ({ cls:"",       title:`${tl()} — Promo: offreren toegestaan`, btns:[["ok","","ok"]] }),
  5: () => ({ cls:"purple", title:`${tl()} — Offer a coffee`,              btns:[["order","primary","order"],["wait","","wait"],["no","","no"]] }),
  6: () => ({ cls:"three",  title:`${tl()} — Ready for next course?`,     btns:[["go","primary","go"],["no","","no"]] }),
  7: () => ({ cls:"three",  title:`Hoi Peter, ben jij nog actief in RES Noord?`,    btns:[["ja","primary","ja"],["nee","","nee"],["pauze","","pauze"]] }),
  8: () => ({ cls:"",       title:`${tl()} — Ready for dessert?`,         btns:[["go","primary","go"],["no","","no"]] }),
  9: () => ({ cls:"",       title:`${tl()} — wil bestellen`, btns:[["order","primary","order"],["dismiss","","dismiss"]] }),
 10: () => ({ cls:"",       title:`${tl()} — wil betalen`,   btns:[["print ticket","primary","print"],["dismiss","","dismiss"]] }),
};

function render(){
  const el = document.getElementById("ctaStack");
  const sorted = [...ctas].sort((a,b)=> (PRIO[a.type]||99)-(PRIO[b.type]||99) || a.createdAt-b.createdAt).slice(0,3);
  el.innerHTML = sorted.map(c => {
    const def = CARD[c.type]();
    const ago = clock - c.createdAt;
    const btns = def.btns.map(([label,cls,act]) =>
      `<button class="ob ${cls==='primary'?'primary':''}" onclick="ctaAction(${c.id},'${act}')">${label}</button>`).join("");
    const three = (def.cls.includes("three")) ? "three" : "";
    const purple = (def.cls.includes("purple")) ? "purple" : "";
    return `<div class="cta ${three} ${purple}">
      <div class="head">
        <span class="ago"><span class="dot"></span> <span id="ago-${c.id}">CTA ${c.type} · ${ago}s geleden</span></span>
      </div>
      <div class="title">${def.title}</div>
      <div class="btns">${btns}</div>
    </div>`;
  }).join("");
}

function toggleTray(){
  const tr = document.getElementById("tray"), tg = document.getElementById("trayToggle");
  tg.textContent = tr.classList.toggle("open") ? "▼ Demo-bediening sluiten" : "▲ Demo-bediening";
}

function tick(){
  clock++;
  if (table.cta5RepushAt && clock >= table.cta5RepushAt && !table.cta5Done && !hasCTA(5)){ table.cta5RepushAt = 0; addCTA(5); }
  if (table.cta6RepushAt && clock >= table.cta6RepushAt && !table.cta6Done && table.mainFiredAt == null && !hasCTA(6)){ table.cta6RepushAt = 0; table.cta6Pushes++; addCTA(6); }
  if (table.cta6AutoFireAt && clock >= table.cta6AutoFireAt && table.mainFiredAt == null){ table.cta6AutoFireAt = 0; table.mainFiredAt = clock; toast("Main auto-fired"); }
  if (table.cta8RepushAt && clock >= table.cta8RepushAt && !table.cta8Done && !hasCTA(8)){ table.cta8RepushAt = 0; table.cta8Pushes++; addCTA(8); }
  updateAgos();   // alleen de "Xs geleden" bijwerken — kaart niet herbouwen (geen beweging)
}
function updateAgos(){
  for (const c of ctas){
    const el = document.getElementById("ago-" + c.id);
    if (el) el.textContent = `CTA ${c.type} · ${clock - c.createdAt}s geleden`;
  }
}

renderGrid();
resetTable();
setInterval(tick, 1000);
</script>
</body>
</html>
